<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Lucas Santana da Paz — LUCAS.DEV</title>
  <desc id="bannerDesc">Banner futurista estilo dashboard: fundo preto azulado, grid sutil, barra lateral ciano elétrico, monograma L/S, nome LUCAS.DEV em destaque, áreas de atuação em ciano e roxo tecnológico.</desc>

  <!-- Fundo preto azulado / grafite -->
  <rect width="1200" height="320" fill="#0d0d12"/>

  <!-- Grid sutil estilo dashboard (pattern) -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a2e" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>   <!-- ciano elétrico -->
      <stop offset="50%" stop-color="#22d3ee"/>  <!-- ciano claro -->
      <stop offset="100%" stop-color="#a78bfa"/> <!-- roxo tecnológico -->
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f5f0ff"/>
    </linearGradient>
  </defs>

  <!-- Grid de fundo -->
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Barra lateral ciano elétrico (indicador ativo) -->
  <rect x="0" y="0" width="6" height="320" fill="url(#accentGradient)"/>

  <!-- Linha decorativa superior -->
  <line x1="30" y1="30" x2="1170" y2="30" stroke="#1a1a2e" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- Área esquerda: informações principais -->
  <g font-family="Consolas, 'Courier New', monospace" fill="#e0f2fe">
    <!-- Localização / Perfil -->
    <text x="72" y="92" font-size="12" letter-spacing="2.5" fill="#64748b">PERFIL · BELO HORIZONTE, MG</text>

    <!-- Nome LUCAS.DEV -->
    <text x="70" y="178" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#textGradient)">LUCAS.DEV</text>

    <!-- Subtítulo / identidade -->
    <text x="70" y="212" font-size="14" letter-spacing="2" fill="#a78bfa" font-weight="500">FULL STACK · SQL · ERP · IA</text>
  </g>

  <!-- Monograma L/S no canto superior direito -->
  <text x="1150" y="68" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#06b6d4" letter-spacing="4" font-weight="700">L/S</text>

  <!-- Área direita: stack / áreas de atuação (painel estilo dashboard) -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.2">
    <text x="1130" y="130" text-anchor="end" fill="#06b6d4">▸ DESENVOLVIMENTO WEB</text>
    <text x="1130" y="156" text-anchor="end" fill="#22d3ee">▸ SISTEMAS E ERP</text>
    <text x="1130" y="182" text-anchor="end" fill="#a78bfa">▸ SQL E BANCO DE DADOS</text>
    <text x="1130" y="208" text-anchor="end" fill="#f472b6">▸ AUTOMAÇÃO COM IA</text>
  </g>

  <!-- Linha separadora inferior -->
  <line x1="72" y1="252" x2="1128" y2="252" stroke="#1a1a2e" stroke-width="1"/>

  <!-- Disponibilidade para oportunidades -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11">
    <text x="72" y="276" fill="#4ade80">▸ DISPONÍVEL PARA OPORTUNIDADES</text>
    <text x="72" y="296" fill="#64748b">ANALISTA JR · SUPORTE ERP · DEV WEB · IA</text>
  </g>

  <!-- Rodapé do banner -->
  <text x="1130" y="296" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#334155" letter-spacing="0.8">PORTFÓLIO: JAPAPAZ696.GITHUB.IO/REPOSITORIO-CURRICULO</text>

  <!-- Elementos decorativos: pequenos indicadores de "dashboard" -->
  <g fill="none" stroke="#1a1a2e" stroke-width="0.8">
    <rect x="72" y="230" width="80" height="16" rx="2"/>
    <rect x="160" y="230" width="80" height="16" rx="2"/>
    <rect x="248" y="230" width="80" height="16" rx="2"/>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="8" fill="#334155">
    <text x="82" y="242" text-anchor="middle">REPOS</text>
    <text x="170" y="242" text-anchor="middle">TESTES</text>
    <text x="258" y="242" text-anchor="middle">DEPLOYS</text>
  </g>
</svg>
